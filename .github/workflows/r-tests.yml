name: R workflow tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install spatial system libraries
        run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev
      - name: Install R packages
        run: Rscript -e 'install.packages(c("terra", "ranger"), repos="https://cloud.r-project.org")'
      - name: Check metrics
        run: Rscript tests/test_metrics.R
      - name: Run synthetic workflow
        run: Rscript tests/test_workflow.R
